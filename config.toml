model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
allow_login_shell = true
project_doc_max_bytes = 16384
tool_output_token_limit = 6000
developer_instructions = "Always use native proactive multi-agent delegation when independent work materially improves correctness or latency; keep trivial work single-agent. Always consult and maintain the project-local `obsidian vault/` for code changes when present, and create/synchronize it through Codex's native project-notes workflow. Keep notes concise, accurate, and free of secrets."

[skills]
max_context_tokens = 4000

[features]
multi_agent = true

[features.multi_agent_v2]
enabled = true
multi_agent_mode_hint_text = "Proactive multi-agent delegation is active. Keep trivial commands and one-file changes single-agent. Delegate only independent work that materially improves latency or correctness; assign non-overlapping responsibilities, respect dependencies and configured concurrency, and consolidate results. Do not duplicate investigations or create agents merely for a quota."

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

